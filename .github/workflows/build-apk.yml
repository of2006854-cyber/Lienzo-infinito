name: Construir APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Aplicar pantalla completa e icono
        run: |
          node scripts/pantalla-completa.js
          node scripts/icono.js

      - name: Copiar la app al proyecto Android
        run: npx cap sync android

      - name: Usar siempre la misma firma (para poder actualizar la app)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Poner nombre al APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Lienzo-infinito.apk

      - name: Guardar el APK como archivo de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: Lienzo-infinito-APK
          path: Lienzo-infinito.apk

      - name: Publicar el APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-ultima
          name: Lienzo infinito (APK más reciente)
          body: Descarga el archivo Lienzo-infinito.apk, ábrelo en tu celular e instálalo.
          files: Lienzo-infinito.apk
          make_latest: true
