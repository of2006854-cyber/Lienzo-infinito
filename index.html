<title>Lienzo infinito</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--paper:#f7f8fa;--ui:#ffffff;--ui-t:#1b2330;--line:#d3d8e0;--hover:#eef1f5;--acc:#2563eb;--acc-t:#ffffff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ui:#1f2430;--ui-t:#e8ebf0;--line:#3a4254;--hover:#2a3142;--acc:#6ea0ff;--acc-t:#101521;color-scheme:dark}}
:root[data-theme="dark"]{--ui:#1f2430;--ui-t:#e8ebf0;--line:#3a4254;--hover:#2a3142;--acc:#6ea0ff;--acc-t:#101521;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--paper);color:var(--ui-t);font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
#c{position:fixed;inset:0;touch-action:none;cursor:crosshair;display:block}
#live{position:fixed;inset:0;pointer-events:none;display:block}
#c.hand{cursor:grab}#c.grabbing{cursor:grabbing}#c.eraser{cursor:cell}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 16px);
display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px;background:var(--ui);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.14)}
.grp{display:flex;gap:4px;align-items:center;padding-right:6px;border-right:1px solid var(--line)}
.grp:last-child{border:0;padding:0}
button{font:inherit;color:var(--ui-t);background:transparent;border:1px solid transparent;border-radius:9px;padding:7px 10px;min-height:36px;cursor:pointer}
button:hover{background:var(--hover)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[aria-pressed="true"]{background:var(--acc);color:var(--acc-t)}
#cols{flex-wrap:wrap;max-width:190px}
.sw{width:26px;height:26px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--ui);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--acc)}
#pdf{background:var(--acc);color:var(--acc-t);font-weight:600}
#pdf:hover{filter:brightness(1.08);background:var(--acc)}
input[type=range]{width:100%;grid-column:1/-1}
select{font:inherit;color:var(--ui-t);background:var(--ui);border:1px solid var(--line);border-radius:9px;padding:6px;min-height:36px}
#zl{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.bar{left:8px;top:calc(8px + env(safe-area-inset-top,0px));bottom:auto;max-height:calc(100% - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));transform:none;max-width:none;width:104px;box-sizing:border-box;flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:flex-start;overflow-y:auto;gap:8px;padding:8px}
.grp{display:grid;grid-template-columns:repeat(2,40px);gap:4px;justify-content:center;align-items:center;padding:0 0 8px;border-right:0;border-bottom:1px solid var(--line)}
.grp:last-child{border:0;padding:0}
.bar button{width:40px;height:40px;min-height:0;padding:0;font-size:18px;display:grid;place-items:center}
.bar .sw{width:26px;height:26px;place-self:center}
#cols{max-width:none}
#zl{grid-column:1/-1;min-width:0}
#warn{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:120px;right:8px;background:#dc2626;color:#fff;border-radius:10px;padding:8px 12px;z-index:6;font-size:13px}
.bar #sv{position:relative}
#dlg{left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;width:min(86vw,320px);gap:6px}
#dlg #dlt{font-weight:600;word-break:break-all;padding:2px 4px 6px}
.chip{position:fixed;left:116px;top:calc(8px + env(safe-area-inset-top,0px));z-index:4;max-width:calc(100% - 132px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--ui);border:1px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.14)}
#dg{left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;width:min(88vw,340px);max-height:80vh;overflow-y:auto;gap:6px}
#dgt{font-weight:600;padding:2px 4px 6px;word-break:break-word}
#dgb{display:flex;flex-direction:column;gap:6px}
#dg input{font:inherit;color:var(--ui-t);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px;width:100%;box-sizing:border-box}
#dg .row{display:flex;gap:6px}
#dg .row button{flex:1;justify-content:center}
.bar,#show{display:none!important}
.tb{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:6;display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--ui);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.14);overflow-x:auto;scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.tb button{flex:0 0 auto;width:40px;height:40px;min-height:0;padding:0;font-size:18px;display:grid;place-items:center}
.tb .sep{flex:0 0 1px;height:26px;background:var(--line);margin:0 4px}
#tcols{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.tb .sw{width:26px;height:26px;padding:0}
.cdot{display:block;width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 1.5px var(--line);background:conic-gradient(#e81c67,#f9ba15,#45a54b,#1c91ef,#962b9c,#e81c67)}
#thki{display:block;border-radius:50%;background:currentColor;width:9px;height:9px}
.pop{position:fixed;z-index:9;min-width:220px;max-width:min(92vw,340px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:8px;background:var(--ui);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.pp{display:flex;flex-direction:column;gap:4px}
.ph2{font-weight:600;padding:2px 4px 4px}
.opt{display:flex;align-items:center;justify-content:flex-start;gap:8px;text-align:left;min-height:40px;padding:6px 12px;white-space:nowrap}
.rw2{display:flex;align-items:center;gap:8px;padding:4px}
.rw2 input[type=range]{flex:1;width:auto}
.pal{display:grid;grid-template-columns:repeat(6,34px);gap:6px;padding:4px;justify-content:center}
.pal .sw{width:30px;height:30px;padding:0}
.mg{display:grid;grid-template-columns:repeat(4,64px);gap:8px 6px;justify-content:center}
.mc{display:flex;flex-direction:column;align-items:center;gap:2px}
.mc button,.mc #zl{width:44px;height:44px;min-height:0;padding:0;font-size:20px;display:grid;place-items:center}
.mc #zl{font-size:12px}
.lb{font-size:10px;text-align:center;line-height:1.1;cursor:pointer}
.hint{font-size:12px;opacity:.75;padding:2px 6px}
#laser{position:fixed;inset:0;pointer-events:none;display:block}
.chip{left:8px;top:calc(64px + env(safe-area-inset-top,0px));max-width:calc(100% - 16px)}
#warn{left:8px;top:calc(108px + env(safe-area-inset-top,0px))}
#toast{top:calc(68px + env(safe-area-inset-top,0px))}
.tb button svg{display:block}.tb button .tool-icon{width:30px;height:30px;max-width:100%;max-height:100%;flex:none}
.cg{display:grid;grid-template-columns:repeat(4,minmax(0,64px));gap:6px;justify-content:center;padding:2px 0}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:64px;height:56px;min-height:0;padding:2px}
.ci{font-size:20px;line-height:1}
.cl{font-size:10px;line-height:1.1}
.bar #sv.dirty::after{content:'';position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:#dc2626}
#szv{grid-column:1/-1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
#pdf{font-size:12px}
.menu{position:fixed;z-index:5;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--ui);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.menu button{display:flex;gap:10px;justify-content:flex-start;align-items:center;min-height:40px;padding:6px 14px;font-size:16px;white-space:nowrap}

#scr{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
#scr.on{opacity:1;pointer-events:auto}
#edge{position:fixed;left:0;top:0;bottom:0;width:12px;z-index:7;touch-action:none}
#drw{position:fixed;left:0;top:0;bottom:0;z-index:11;width:min(86vw,330px);display:flex;flex-direction:column;box-sizing:border-box;padding:calc(14px + env(safe-area-inset-top,0px)) 0 calc(10px + env(safe-area-inset-bottom,0px));background:#2b2b2b;color:#f1f1f1;box-shadow:6px 0 28px rgba(0,0,0,.45);transform:translateX(-105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;touch-action:pan-y}
#drw.on{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
#drw.drag{transition:none;visibility:visible}
#drw button{color:inherit;background:none;border:0;border-radius:8px}
#drw button:hover{background:rgba(255,255,255,.1)}
#drw svg{flex:none;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dtop{padding:0 18px}

.dr.hd{cursor:pointer;user-select:none}

.dr input{flex:1;min-width:0;background:none;border:0;outline:0;color:#f1f1f1;font:inherit;font-size:18px;padding:0;height:56px;appearance:none;-webkit-appearance:none}
.dr input::placeholder{color:#f1f1f1;opacity:1}
.dr.fo{color:#2a9bc4;background:rgba(42,155,196,.16);margin:0 -18px;padding:0 18px;border-bottom:0}

.dr .pl svg{width:30px;height:30px}
.sub{padding:2px 0 8px}
.it{display:flex;align-items:center;min-height:46px;gap:2px;border-radius:8px}
.it.cur{background:rgba(255,255,255,.09)}
.it .tl{flex:1;min-width:0;text-align:left;font-size:16px;padding:6px 8px;min-height:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.it .tl small{display:block;color:#9a9a9a;font-size:12px;line-height:1.2}
.it .tl.dim{color:#bdbdbd;cursor:default}

#drw .it .fl svg{width:20px;height:20px;color:#2a9bc4}
.it .tm{width:40px;min-height:44px;font-size:18px;color:#bdbdbd;display:grid;place-items:center;padding:0}
#drw .it .tm svg{width:20px;height:20px}
.emp{color:#9a9a9a;font-size:14px;padding:8px 6px}
.emptyT{border:1px solid rgba(255,255,255,.18)!important;font-size:14px;padding:6px 12px;margin:4px 0 4px 6px}
.dft{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0;border-top:1px solid rgba(255,255,255,.09)}
.dft button{border:1px solid rgba(255,255,255,.18)!important;font-size:14px}
.fch{display:flex;transition:transform .2s;color:#bdbdbd}
.fch.o{transform:rotate(90deg)}
#drw .it .fl .fch svg{width:16px;height:16px;color:#bdbdbd}
.fnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.fct{color:#9a9a9a;font-size:13px;padding-right:4px}

#sbar{position:fixed;z-index:6;display:flex;gap:4px;padding:4px;background:var(--ui);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#sbar button{min-height:40px;padding:6px 12px;font-size:14px;white-space:nowrap}
#crp{position:fixed;inset:0;z-index:13;background:#111;color:#f1f1f1;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);touch-action:none;user-select:none;-webkit-user-select:none}
#crp button{color:inherit;background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:8px 12px;min-height:40px}
#crp button:hover{background:rgba(255,255,255,.1)}
#crp button[aria-pressed="true"]{background:#2563eb;border-color:#2563eb}
.chd,.cft{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#111}
.chd{justify-content:space-between}
.cft{flex-wrap:wrap;justify-content:center}
#cst{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}
#cbx{position:relative;touch-action:none}
#cim{display:block;width:100%;height:100%;pointer-events:none}
#crr{position:absolute;box-sizing:border-box;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.62);cursor:move;touch-action:none}
#crr i{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;touch-action:none}
#crr i::after{content:'';position:absolute;left:10px;top:10px;width:12px;height:12px;background:#fff;border:1px solid #2563eb;border-radius:3px}
#crr i[data-h=nw]{left:0;top:0;cursor:nwse-resize}#crr i[data-h=n]{left:50%;top:0;cursor:ns-resize}#crr i[data-h=ne]{left:100%;top:0;cursor:nesw-resize}
#crr i[data-h=e]{left:100%;top:50%;cursor:ew-resize}#crr i[data-h=se]{left:100%;top:100%;cursor:nwse-resize}#crr i[data-h=s]{left:50%;top:100%;cursor:ns-resize}
#crr i[data-h=sw]{left:0;top:100%;cursor:nesw-resize}#crr i[data-h=w]{left:0;top:50%;cursor:ew-resize}
[hidden]{display:none!important}
.pill{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--ui);border:1px solid var(--line);border-radius:12px;padding:0;width:44px;height:44px;font-size:20px;box-shadow:0 4px 18px rgba(0,0,0,.14)}
#toast{z-index:14;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ui);color:var(--ui-t);border:1px solid var(--line);border-radius:10px;padding:8px 14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>

function mkLinkImg(url,title){const m=linkMeta(url),S=2,W0=560,H0=132,c=document.createElement('canvas');c.width=W0*S;c.height=H0*S;const g=c.getContext('2d');g.scale(S,S);
 rrect(g,2,2,W0-4,H0-4,22);g.fillStyle='#ffffff';g.fill();g.lineWidth=3;g.strokeStyle='#cfd5df';g.stroke();
 rrect(g,18,18,96,96,22);g.fillStyle=m.c;g.fill();g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
 if(m.k==='yt'){g.beginPath();g.moveTo(54,40);g.lineTo(54,92);g.lineTo(94,66);g.closePath();g.fill()}
 else if(m.k==='g'){g.font='700 62px system-ui,-apple-system,Segoe UI,sans-serif';g.fillText('G',66,68)}
 else{g.font='700 58px system-ui,-apple-system,Segoe UI,sans-serif';g.fillText('↗',66,68)}
 g.textAlign='left';g.textBaseline='alphabetic';const mw=W0-140-24;
 g.font='700 32px system-ui,-apple-system,Segoe UI,sans-serif';g.fillStyle='#1b2330';g.fillText(fitText(g,title||m.n,mw),134,62);
 g.font='400 22px system-ui,-apple-system,Segoe UI,sans-serif';g.fillStyle='#667085';g.fillText(fitText(g,url.replace(/^https?:\/\/(www\.)?/i,'').replace(/^mailto:/i,''),mw),134,96);
 return{src:c.toDataURL('image/png'),iw:W0*S,ih:H0*S}}
function askLink(v){return mkDlg(v?'Editar enlace':'Nuevo enlace',(b,done)=>{
 const u=document.createElement('input');u.type='text';u.inputMode='url';u.autocapitalize='off';u.spellcheck=false;u.maxLength=2000;u.placeholder='Pega un enlace o escribe para buscar en Google';u.value=v?v.url:'';
 const t=document.createElement('input');t.type='text';t.maxLength=60;t.placeholder='Título (opcional)';t.value=v?(v.title||''):'';
 const ch=document.createElement('div');ch.className='row';ch.style.flexWrap='wrap';
 for(const[n,h]of[['▶ YouTube','https://www.youtube.com/'],['G Google','https://www.google.com/'],['Drive','https://drive.google.com/'],['Wikipedia','https://es.wikipedia.org/']]){const c=mkBtn(n,()=>{u.value=h;u.focus()});c.style.flex='1 1 40%';ch.appendChild(c)}
 const r=document.createElement('div');r.className='row';
 const ok=mkBtn('Aceptar',()=>{const nu=normUrl(u.value);if(!nu){toast('Enlace no válido');u.focus();return}done({url:nu,title:t.value.trim()})});
 r.append(ok,mkBtn('Cancelar',()=>done(null)));b.append(u,t,ch,r);
 u.onkeydown=t.onkeydown=e=>{if(e.key==='Enter')ok.click()};setTimeout(()=>u.focus(),60)})}
function addLink(url,title){const k=mkLinkImg(url,title),ww=Math.min(300,(W-40)*.85)/view.z,hh=ww*k.ih/k.iw,[cx,cy]=tw(W/2,H/2+40),x0=cx-ww/2,y0=cy-hh/2;

function cropLayout(){if(!CR)return;const st=$('cst'),aw=Math.max(60,st.clientWidth-24),ah=Math.max(60,st.clientHeight-24),im=CR.im,k=Math.min(aw/im.naturalWidth,ah/im.naturalHeight);
 CR.B={w:Math.max(40,Math.floor(im.naturalWidth*k)),h:Math.max(40,Math.floor(im.naturalHeight*k))};const bx=$('cbx');bx.style.width=CR.B.w+'px';bx.style.height=CR.B.h+'px';cropPaint()}

 document.querySelectorAll('#cas [data-a]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.a===String(a))));
 if(CR.asp&&CR.B){const B=CR.B,r={x:CR.f.x*B.w,y:CR.f.y*B.h,w:CR.f.w*B.w,h:CR.f.h*B.h},cx=r.x+r.w/2,cy=r.y+r.h/2;let w=r.w,h=r.h;if(w/h>CR.asp)w=h*CR.asp;else h=w/CR.asp;
  const x=Math.max(0,Math.min(B.w-w,cx-w/2)),y=Math.max(0,Math.min(B.h-h,cy-h/2));CR.f={x:x/B.w,y:y/B.h,w:w/B.w,h:h/B.h};cropPaint()}}
function startCrop(s){if(!s||!s.img||s.lk||s.fill)return;if(!s.src){toast('La imagen aún se está cargando, intenta de nuevo');return}
 const im=new Image();im.onerror=()=>toast('No se pudo abrir la imagen');
 im.onload=()=>{CR={s,im,f:{x:0,y:0,w:1,h:1},asp:0,B:{w:1,h:1}};$('cim').src=s.src;$('crp').hidden=false;$('sbar').hidden=true;cropAsp('0');cropLayout()};im.src=s.src}
function closeCrop(){$('crp').hidden=true;CR=null;cdrag=null;$('cim').removeAttribute('src');draw()}
function applyCrop(){if(!CR)return;const s=CR.s,im=CR.im,f=CR.f,nw=im.naturalWidth,nh=im.naturalHeight;
 const sx=Math.round(f.x*nw),sy=Math.round(f.y*nh),sw=Math.max(1,Math.min(nw-sx,Math.round(f.w*nw))),sh=Math.max(1,Math.min(nh-sy,Math.round(f.h*nh)));
 if(sw>=nw-1&&sh>=nh-1){closeCrop();return}
 const c=document.createElement('canvas');c.width=sw;c.height=sh;const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(im,sx,sy,sw,sh,0,0,sw,sh);
 let src;try{src=c.toDataURL('image/webp',.95);if(!/^data:image\/webp/.test(src))src=c.toDataURL('image/png')}catch(e){toast('No se pudo recortar la imagen');return}
 sel=[s];prep();const o=sel[0],P=o.p,Ux=P[2]-P[0],Uy=P[3]-P[1],Vx=P[6]-P[0],Vy=P[7]-P[1],fx=sx/nw,fy=sy/nh,fw=sw/nw,fh=sh/nh;
 const ox=P[0]+Ux*fx+Vx*fy,oy=P[1]+Uy*fx+Vy*fy,ux=Ux*fw,uy=Uy*fw,vx=Vx*fh,vy=Vy*fh;
 o.p=[ox,oy,ox+ux,oy+uy,ox+ux+vx,oy+uy+vy,ox+vx,oy+vy].map(v=>Math.round(v*100)/100);
 o.src=src;o.iw=sw;o.ih=sh;o.id=newImgId();
 closeCrop();sel=[o];draw();save();toast('Imagen recortada')}
(()=>{const rr=$('crr'),MIN=28,cl=(v,a,b)=>Math.max(a,Math.min(b,v));

  cdrag={id:e.pointerId,h,sx:e.clientX,sy:e.clientY,r:{x:CR.f.x*B.w,y:CR.f.y*B.h,w:CR.f.w*B.w,h:CR.f.h*B.h}};try{rr.setPointerCapture(e.pointerId)}catch(_){}});
 rr.addEventListener('pointermove',e=>{if(!CR||!cdrag||e.pointerId!==cdrag.id)return;const B=CR.B,d=cdrag,dx=e.clientX-d.sx,dy=e.clientY-d.sy,r0=d.r;let x0=r0.x,y0=r0.y,x1=r0.x+r0.w,y1=r0.y+r0.h;
  if(d.h==='m'){const x=cl(r0.x+dx,0,B.w-r0.w),y=cl(r0.y+dy,0,B.h-r0.h);x0=x;y0=y;x1=x+r0.w;y1=y+r0.h}
  else{const hw=d.h.includes('w'),he=d.h.includes('e'),hn=d.h.includes('n'),hs=d.h.includes('s');
   if(hw)x0=cl(r0.x+dx,0,x1-MIN);if(he)x1=cl(r0.x+r0.w+dx,x0+MIN,B.w);if(hn)y0=cl(r0.y+dy,0,y1-MIN);if(hs)y1=cl(r0.y+r0.h+dy,y0+MIN,B.h);
   const a=CR.asp;if(a){let w=x1-x0,h=y1-y0;const hz=hw||he,vt=hn||hs;
    if(hz&&!vt){const cy=r0.y+r0.h/2,mh=Math.min(cy,B.h-cy)*2;w=Math.min(w,mh*a);h=w/a;if(hw)x0=x1-w;else x1=x0+w;y0=cy-h/2;y1=cy+h/2}
    else if(vt&&!hz){const cx=r0.x+r0.w/2,mw=Math.min(cx,B.w-cx)*2;h=Math.min(h,mw/a);w=h*a;if(hn)y0=y1-h;else y1=y0+h;x0=cx-w/2;x1=cx+w/2}
    else{const mw=hw?x1:B.w-x0,mh=hn?y1:B.h-y0;w=Math.min(w,mw,mh*a);h=w/a;if(hw)x0=x1-w;else x1=x0+w;if(hn)y0=y1-h;else y1=y0+h}}}
  CR.f={x:x0/B.w,y:y0/B.h,w:(x1-x0)/B.w,h:(y1-y0)/B.h};cropPaint()});
 const en=e=>{if(cdrag&&e.pointerId===cdrag.id)cdrag=null};rr.addEventListener('pointerup',en);rr.addEventListener('pointercancel',en);
 document.querySelectorAll('#cas [data-a]').forEach(b=>b.onclick=()=>cropAsp(b.dataset.a));
